name: CI
on: [push, pull_request]
# Each job declares timeout-minutes so a hung step fails fast
# instead of inheriting the 360-minute GitHub default.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # A git dependency ships to every CONSUMER of this package: npm re-resolves
      # a published package's specs from its own manifest and never sees the
      # lockfile committed here, so a `github:` spec in `dependencies` costs each
      # install a git clone, a reachable GitHub, and any `insteadOf` rewrite the
      # machine happens to carry - and gives up the registry integrity hash.
      #
      # The specs sat on `main` for months while every required check stayed
      # green, because none of them read the specs: #25 tried to remove them and
      # was failed by a SCHEDULED job, hours after the merge. engine-pins.yml
      # rejects the shape too, but it is the assertion a reviewer sees on the
      # pull request that matters, which is why this runs first and on every push.
      - name: No dependency is installed over git
        # On `next2` the 0.2 engine has no registry release yet, so a commit pin
        # on a markup-carve repository is accepted there and nowhere else; the
        # release draft into `main` stays red until the pin is a version.
        env:
          CARVE_PRERELEASE_PINS: ${{ (github.ref == 'refs/heads/next2' || github.base_ref == 'next2') && '1' || '' }}
        run: node tools/no-git-dependencies.mjs

      # Kept for TRANSITIVE git specs: nothing in this manifest resolves over git
      # any more, but a dependency of a dependency still can, and this costs
      # nothing when there are none.
      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The conformance corpus, in the blocking path.
  #
  # Carve 0.2 has no `tests/corpus` directory: its corpus is the render cases of
  # `spec/0.2/conformance/`. The ref is the spec commit the pinned carve-js
  # names in its `spec` submodule, so the engine is held to the corpus it was
  # written against. The ref, the engine pin in package.json and
  # tools/conformance-divergences-at-pin.txt move together in one change.
  corpus:
    name: The installed engine against the pinned 0.2 conformance corpus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Check out the conformance corpus at the engine's spec commit
        uses: actions/checkout@v5
        with:
          repository: markup-carve/carve
          ref: 8e56382c0b983f486bf9c848bddf542e7791c9ff
          path: carve-spec

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:

      - run: npm ci

      - name: Render every conformance case through the engine as installed
        run: |
          set -euo pipefail
          node tools/conformance-through-engine.mjs \
            node_modules/@markup-carve/carve/dist/index.js \
            carve-spec/spec/0.2/conformance \
            --list --baseline=tools/conformance-divergences-at-pin.txt | tee "${RUNNER_TEMP}/conformance-run.txt"
          documents="$(sed -n 's/^documents=//p' "${RUNNER_TEMP}/conformance-run.txt")"
          wrong="$(sed -n 's/^wrong=//p' "${RUNNER_TEMP}/conformance-run.txt")"
          if [ -z "${documents}" ] || [ "${documents}" = "0" ] || [ -z "${wrong}" ]; then
            echo "::error::the run measured no conformance cases, so nothing here is a result"
            exit 1
          fi
          echo "${wrong} of ${documents} conformance cases render differently, the set recorded at the pin"
