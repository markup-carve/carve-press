# carve-press was tagged v0.1.0 and released on GitHub, and npm has never
# served it. The repo had ci.yml, engine-drift.yml and pages.yml and no
# release workflow at all, so nothing could publish it - the release page said
# shipped and the registry said absent. This workflow is the missing half.
#
# THE GATE RUNS BEFORE PUBLISH, AND PUBLISH SITS BEHIND IT VIA `needs:`. A
# check placed in front of a publish step in the SAME job goes green when it is
# skipped; only a separate job makes the publish unreachable rather than merely
# later. That is what half-released carve-py.
#
# THE GATE MEASURES THE PACKED TARBALL. This package ships `dist/`, which
# exists only because `prepare` runs - a source tree that builds says nothing
# about what npm would serve.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # A rehearsal: everything runs and the publish becomes --dry-run. The first
  # run of a release workflow should not be the moment a tag makes it
  # irreversible, because npm refuses to replace a published version.
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without v; leave empty for rehearsal
        required: false
        type: string

# Each job declares timeout-minutes so a hung step fails fast
# instead of inheriting the 360-minute GitHub default.
jobs:
  guard:
    name: The tag agrees with the package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: package.json version matches the tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "$RELEASE_VERSION" ]; then
            tag="$(node -p 'require("./package.json").version')"
            echo "rehearsal: no tag exists, using package.json ($tag)"
          else
            tag="${RELEASE_TAG#v}"
          fi
          got="$(node -p 'require("./package.json").version')"
          [ "$got" = "$tag" ] \
            || { echo "::error::package.json declares '$got', tag is '$tag'"; exit 1; }
          echo "version $got"

      - name: The changelog describes this version
        run: |
          v="${RELEASE_TAG#v}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && v="$(node -p 'require("./package.json").version')"
          grep -qE "^## \[?${v}\]? - " CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section for ${v}"; exit 1; }

      # npm verifies the attestation's repository claim against this field and
      # answers 422 when they differ. tree-sitter-carve 0.1.3 failed here twice,
      # live, because no rehearsal can reach it: `npm publish --dry-run
      # --provenance` skips provenance entirely, so the registry never sees a
      # bundle. Comparing the two strings costs nothing.
      - name: package.json points at this repository
        run: |
          want="https://github.com/${{ github.repository }}"
          got="$(node -p 'require("./package.json").repository?.url ?? ""')"
          norm="$(printf %s "$got" | sed -e 's|^git+||' -e 's|\.git$||')"
          [ "$norm" = "$want" ] \
            || { echo "::error::package.json repository.url is '$got' (normalizes to '$norm'); npm provenance requires '$want'"; exit 1; }
          echo "repository.url matches $want"

      # No git dependencies. The grammars dependency was a bare commit pin that
      # had fallen three commits BEHIND the published package, so an install
      # cloned a stale grammar over git and nothing said so.
      - name: No dependency is installed over git
        run: |
          bad="$(node -p '
            const d = require("./package.json");
            Object.entries({...d.dependencies, ...d.peerDependencies} ?? {})
              .filter(([, v]) => /^(github:|git\+|git:)/.test(v))
              .map(([k, v]) => k + " -> " + v).join("\n")')"
          [ -z "$bad" ] \
            || { echo "::error::git dependencies would ship to consumers:"; echo "$bad"; exit 1; }
          echo "all dependencies resolve from the registry"

      - name: The npm credential actually authenticates
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          code="$(curl -sS -o /tmp/npm-who.json -w '%{http_code}' \
            -H "Authorization: Bearer $NPM_TOKEN" https://registry.npmjs.org/-/whoami)"
          [ "$code" = "200" ] \
            || { echo "::error::NPM_TOKEN does not authenticate (HTTP $code)"; exit 1; }
          echo "npm: authenticated as $(node -p 'require("/tmp/npm-who.json").username')"

  verify:
    name: Build, test, and inspect the packed tarball
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [guard]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

      # `files` lists dist/ and the theme assets. dist/ is generated, so a
      # tarball built without `prepare` having run would be an empty shell that
      # installs cleanly and fails on first import.
      - name: The tarball carries the built output
        run: |
          tarball="$(npm pack --silent)"
          listing="$(tar -tzf "$tarball")"
          missing=0
          for want in dist/index.js dist/index.d.ts dist/cli.js theme/default.css README.md LICENSE; do
            printf '%s\n' "$listing" | grep -q "^package/$want$" \
              || { echo "::error::the tarball is missing $want"; missing=1; }
          done
          n="$(printf '%s\n' "$listing" | grep -c '^package/dist/.*\.js$')"
          [ "$n" -ge 10 ] \
            || { echo "::error::only $n compiled file(s) under dist/; prepare did not run"; missing=1; }
          echo "$n compiled files under dist/"
          exit $missing

      # What a consumer gets, not what the source tree does.
      - name: The packed tarball imports and builds a site
        run: |
          tarball="$(npm pack --silent)"
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/$tarball"
          node --input-type=module -e '
            const m = await import("@markup-carve/carve-press");
            const names = Object.keys(m);
            if (names.length === 0) throw new Error("the package exports nothing");
            console.log("exports:", names.slice(0, 12).join(", "));
          '

  npm-credential:
    name: The npm credential can publish this package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # GATE, and a separate job on purpose. The first irreversible act in this
      # workflow is `npm publish` itself, so the publish job has to depend on a
      # job it cannot reach past. Written as a step inside the publish job it
      # would be skippable while the job still reported green, which is the
      # shape that shipped a vulnerable carve-py in this organization.
      #
      # WHY IT EXISTS. carve-grammars v0.1.13, 2026-10-08: every gate passed,
      # the release was approved, the tag was created, Packagist served it
      # within two minutes, and then `npm publish` answered
      # "404 Not Found - PUT" on the package URL. npm answers 404 rather than
      # 403 for a scoped package so it does not leak existence, so that is an
      # authorization failure and not a missing package: 0.1.11 was serving at
      # the time. The result was a version on Packagist that npm did not have.
      # A credential is checkable without publishing anything, and it was the
      # one precondition no gate checked.
      #
      # Nothing below publishes, changes or deprecates anything.
      - name: The token is live and can write this package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is not readable from this repository, so the publish cannot authenticate at all."
            exit 1
          fi

          # FATAL. An expired, revoked or malformed token fails here with
          # 401 / ENEEDAUTH, and this is the one probe below whose failure is
          # unambiguous.
          if ! who="$(npm whoami 2>&1)"; then
            echo "::error::npm rejected the credential: ${who}"
            echo "::error::rotate NPM_TOKEN before releasing. A 404 on PUT is an auth failure, not a missing package."
            exit 1
          fi
          echo "authenticated as ${who}"

          pkg="$(node -p "require('./package.json').name")"
          echo "package under release: ${pkg}"

          # REPORTED, NOT FATAL, and measured rather than assumed. This is the
          # organization endpoint /-/org/<scope>/package, an org read and not a
          # package write. On carve-wasm run 32156381782 this organization's
          # NPM_TOKEN answered 403 "You may not perform that action with these
          # credentials" here, while an anonymous GET of the same URL returned
          # the whole scope. A credential with fewer rights than a stranger on
          # an org endpoint is the signature of a granular access token, which
          # says nothing about whether it can publish. Made fatal, as the first
          # draft of this gate had it, this would refuse every release in this
          # organization.
          echo "== packages this credential can see in the scope"
          if ! npm access list packages 2>&1; then
            echo "  REFUSED on the org endpoint. An anonymous reader is not refused here, so this"
            echo "  is about the credential's kind, not about the scope being unreachable."
          fi

          # The discriminator, and the reason the two probes above are not
          # enough. A classic automation token can read this endpoint and a
          # granular one cannot. A classic token carries its owner's publish
          # rights, so with a read-write grant below the publish is as proven
          # as it gets without publishing. A granular token's package grants
          # are fixed when it is created and are not readable from here at all,
          # which is the residual risk this gate cannot close.
          echo "== the kind of credential"
          if npm token list >/dev/null 2>&1; then
            echo "  classic automation token: it carries the owner's publish rights."
          else
            echo "  granular access token: its package grants are fixed at creation and cannot be"
            echo "  read from here. If this package is not among them the publish fails with E404"
            echo "  and no change in this repository can fix it. Check the token at npmjs.com."
          fi

          # FATAL ONLY ON A DEFINITE NEGATIVE. Note what this is and is not:
          # the collaborators endpoint is a PUBLIC read, so it reports the npm
          # USER's grant on the package and not the token's. A read-only grant
          # therefore means the publish cannot succeed whatever the token is,
          # which is worth stopping for; read-write does not prove the token
          # inherits it, which is why it is not reported as a pass.
          echo "== the account's grant on the package"
          if grants="$(npm access list collaborators "${pkg}" --json 2>/dev/null)"; then
            mine="$(printf '%s' "${grants}" | jq -r --arg u "${who}" '.[$u] // "not listed"')"
            echo "  ${who}: ${mine}"
            if [ "${mine}" = "read-only" ]; then
              echo "::error::${who} holds read-only access to ${pkg}, so the publish cannot succeed."
              echo "::error::grant write access or rotate NPM_TOKEN before releasing."
              exit 1
            fi
          else
            echo "  the endpoint did not answer, which does not distinguish 'no permission' from"
            echo "  'no such package', so it is not treated as a verdict."
          fi

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - guard
      - verify
      - npm-credential
      - tag
    # --provenance signs an attestation binding the tarball to this commit, and
    # that needs an OIDC token. `id-token` is never granted implicitly, not even
    # when the repository default is read-write; omitting this block does not
    # weaken provenance, it makes the publish FAIL.
    permissions:
      # `write`, not `read`, and the gate below is the whole reason: a DRAFT
      # release is invisible to a caller without push access, so under
      # `contents: read` the listing comes back empty and the gate reports
      # "no release" for a draft that is sitting right there with notes in
      # it. See markup-carve/carve-wasm#80.
      contents: write
      id-token: write
    steps:
      # GATE: the notes are not the workflow's to write. A CHANGELOG entry is
      # deliberately one or two lines for a contributor, which makes poor
      # release notes for a reader deciding whether to upgrade. A human writes
      # the draft first and this refuses to publish without one.
      #
      # Found by listing rather than `gh release view <tag>`: a draft's tag is
      # not a git ref, so addressing one by tag can match nothing, change
      # nothing and still exit 0.
      - name: A release draft for this tag exists and has notes
        if: (github.event_name != 'workflow_dispatch' || inputs.version != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$RELEASE_TAG\")] | first")"
          if [ -z "$release" ]; then
            echo "::error::no release for $RELEASE_TAG. Write the notes first:" \
                 "gh release create $RELEASE_TAG --draft --notes-file NOTES.md"
            echo "::error::if a draft DOES exist, this job could not see it -" \
                 "check that the job still declares contents: write"
            exit 1
          fi
          body="$(printf '%s' "$release" | jq -r '.body // ""' | tr -d '[:space:]')"
          [ -n "$body" ] \
            || { echo "::error::the release for $RELEASE_TAG has no notes"; exit 1; }
          printf '%s' "$release" | jq -r '"draft=\(.draft) tag=\(.tag_name)"'

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build

      # A missing credential FAILS rather than skipping. A skipped publish that
      # leaves the job green is what half-released carve-py.
      - name: The npm credential is present
        run: |
          [ -n "${{ secrets.NPM_TOKEN }}" ] \
            || { echo "::error::NPM_TOKEN is not available to this repository"; exit 1; }

      - name: Publish to npm
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "$RELEASE_VERSION" ]; then
            npm publish --dry-run --provenance --access public
            echo "::notice::rehearsal - nothing was published to npm"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A registry publish is not finished until the release page exists. The
      # tag is pushed, CI publishes, the registry answers 200, and "released"
      # feels done - while `/releases` still shows a draft, so a reader has no
      # notes and no changelog for the version they just installed. Doing it
      # here rather than by hand also means the draft stops being a thing
      # someone has to remember to publish at the right moment.
      #
      # Last, deliberately: a draft that stays a draft is recoverable, and one
      # published beside a failed publish is not.
      - name: Publish the release notes
        if: (github.event_name != 'workflow_dispatch' || inputs.version != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$RELEASE_TAG\" and .draft)] | first | .id // empty")"
          if [ -z "$id" ]; then
            echo "No draft release for $RELEASE_TAG; nothing to publish."
            exit 0
          fi
          # `tag_name` goes with every PATCH of a release. Omit it on a DRAFT
          # and GitHub replaces the tag with a generated `untagged-*`
          # placeholder, because a draft's tag is a string on the object rather
          # than a git ref - so the field has nothing to fall back to.
          # `-F` (not `-f`) for draft, so it is sent as a boolean.
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" -X PATCH \
            -f tag_name="$RELEASE_TAG" -F draft=false --jq '"published \(.tag_name)"'
          # Read it back: exit status does not tell you whether the tag survived.
          gh api "repos/$GITHUB_REPOSITORY/releases/$id" \
            --jq '"draft=\(.draft) tag=\(.tag_name)"'
  tag:
    name: Create the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - guard
      - verify
      - npm-credential
      - release-checks
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the tag unless it already exists
        run: |
          set -euo pipefail
          candidate="${RELEASE_TAG#v}"
          [[ "$candidate" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must be X.Y.Z"; exit 1; }
          version="$(node -p 'require("./package.json").version')"
          [ "$version" = "$candidate" ] || { echo "::error::Package version $version differs from $RELEASE_TAG"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            remote="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | tail -1 | cut -f1)"
            [ "$remote" = "$GITHUB_SHA" ] || { echo "::error::Existing tag points to another commit"; exit 1; }
            echo "$RELEASE_TAG is already on the remote; creating nothing."
            exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::this run is on tag $RELEASE_TAG, which is not on the remote."
            exit 1
          fi
          # Re-checked under the approval: a tag can appear while a run waits.
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
          echo "tagged $RELEASE_TAG at $GITHUB_SHA"
    if: github.ref_type == 'tag' || inputs.version != ''
  release-checks:
    name: Verify release before approval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - guard
      - verify
      - npm-credential
    permissions:
      # `write`, not `read`, and the gate below is the whole reason: a DRAFT
      # release is invisible to a caller without push access, so under
      # `contents: read` the listing comes back empty and the gate reports
      # "no release" for a draft that is sitting right there with notes in
      # it. See markup-carve/carve-wasm#80.
      contents: write
    steps:
      # GATE: the notes are not the workflow's to write. A CHANGELOG entry is
      # deliberately one or two lines for a contributor, which makes poor
      # release notes for a reader deciding whether to upgrade. A human writes
      # the draft first and this refuses to publish without one.
      #
      # Found by listing rather than `gh release view <tag>`: a draft's tag is
      # not a git ref, so addressing one by tag can match nothing, change
      # nothing and still exit 0.
      - name: A release draft for this tag exists and has notes
        if: (github.event_name != 'workflow_dispatch' || inputs.version != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$RELEASE_TAG\")] | first")"
          if [ -z "$release" ]; then
            echo "::error::no release for $RELEASE_TAG. Write the notes first:" \
                 "gh release create $RELEASE_TAG --draft --notes-file NOTES.md"
            echo "::error::if a draft DOES exist, this job could not see it -" \
                 "check that the job still declares contents: write"
            exit 1
          fi
          body="$(printf '%s' "$release" | jq -r '.body // ""' | tr -d '[:space:]')"
          [ -n "$body" ] \
            || { echo "::error::the release for $RELEASE_TAG has no notes"; exit 1; }
          printf '%s' "$release" | jq -r '"draft=\(.draft) tag=\(.tag_name)"'

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build

      # A missing credential FAILS rather than skipping. A skipped publish that
      # leaves the job green is what half-released carve-py.
      - name: The npm credential is present
        run: |
          [ -n "${{ secrets.NPM_TOKEN }}" ] \
            || { echo "::error::NPM_TOKEN is not available to this repository"; exit 1; }

env:
  RELEASE_TAG: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
  RELEASE_VERSION: ${{ inputs.version }}
