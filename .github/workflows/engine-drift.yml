name: Engine drift

# Both org dependencies are GIT DEPENDENCIES pinned to a revision. A pin makes
# drift deliberate, but nothing notices when a pin has fallen behind - and a
# push-only CI reports the state of the day someone last touched the repo.
#
# That is not hypothetical across the org. carve-hexapdf pinned nothing, was not
# pushed for five days while two AST renames landed upstream, and its badge
# stayed green on a stale run while a fresh install rendered bold text unstyled
# and dropped every footnote marker (carve-hexapdf#10). A site generator has the
# same exposure: the engine decides what every page renders as.
#
# It reports rather than gates on lag: upstream moving is not a defect here, and
# a job that goes red for something outside the repository teaches people to
# ignore it. It DOES fail when a pin is not a 40-hex revision, or is not a real
# commit on that repository's main. carve-js has rewritten history before -
# three sibling repos pinned revisions a fresh clone cannot check out
# (carve#499) - so an unreachable pin is a real failure mode, not a hypothetical.

on:
  schedule:
    # 05:00 UTC daily, after the upstream repos have had a night to settle.
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dep: "@markup-carve/carve"
            repo: markup-carve/carve-js
            path: carve-js
          - dep: "@markup-carve/carve-grammars"
            repo: markup-carve/carve-grammars
            path: carve-grammars
    steps:
      - uses: actions/checkout@v4

      - name: Check out ${{ matrix.repo }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: ${{ matrix.path }}
          fetch-depth: 0

      - name: Compare the pinned revision against ${{ matrix.path }} main
        env:
          DEP: ${{ matrix.dep }}
          DIR: ${{ matrix.path }}
        run: |
          set -euo pipefail
          spec="$(node -p "require('./package.json').dependencies['${DEP}']")"
          rev="${spec##*#}"
          if ! printf '%s' "${rev}" | grep -qE '^[0-9a-f]{40}$'; then
            echo "::error::${DEP} is \"${spec}\" - it must pin a 40-hex revision, or a build takes whatever was on the default branch at install time"
            exit 1
          fi
          if ! git -C "${DIR}" cat-file -e "${rev}^{commit}" 2>/dev/null; then
            echo "::error::${DEP} pins ${rev}, which is not a commit in ${DIR}"
            exit 1
          fi
          if ! git -C "${DIR}" merge-base --is-ancestor "${rev}" origin/main; then
            echo "::error::${DIR} ${rev} is not on main, so the pin came from an unmerged or rewritten branch"
            exit 1
          fi
          behind="$(git -C "${DIR}" rev-list --count "${rev}..origin/main")"
          echo "pinned ${DEP}: ${rev} ($(git -C "${DIR}" log -1 --format=%s "${rev}"))"
          echo "${DIR} main is ${behind} commit(s) ahead"
          if [ "${behind}" -gt 0 ]; then
            echo "::warning::${DEP} is ${behind} ${DIR} commit(s) behind main"
          fi

  # The pins make the org dependencies deterministic; the rest of the tree still
  # floats and a scheduled run of the real suite is what catches one of those
  # changing underneath.
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The lockfile records the git dependencies as `git+ssh://`, so a runner
      # without an SSH key cannot fetch them. Same step as ci.yml and pages.yml.
      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
