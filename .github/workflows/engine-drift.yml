name: Engine drift

# The org dependency pins themselves are asserted by engine-pins.yml, on every
# pull request. This workflow watches what no pull request can settle: carve
# `main` moving ahead of the pinned engine, and unpinned dependencies moving
# under the suite. It runs on a schedule and files its verdict as one issue.
# A drift verdict files that issue and the run stays green; a check that could
# not measure (crash, fetch failure, failing suite, failed filing) stays red.

# The revision distance engine-pins.yml reports can never fail, and that was the
# half missing. Every scheduled run was green while the pin drifted 333 commits and
# 256 of 1131 corpus documents rendered wrongly (carve-press#19). A warning is
# the right instrument when the remedy is upstream and unavailable here - it is
# what the carve-php satellites report, because only a release can close their
# gap. It is the wrong instrument here: the remedy is one line of package.json
# in this repository. So the `corpus` job below measures what the pinned engine
# DOES, in documents, and files the count as a ticket.

on:
  schedule:
    # 05:00 UTC daily, after the upstream repos have had a night to settle.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  # How many corpus documents the pinned engine may render differently from
  # carve `main` THAT carve-js `main` GETS RIGHT, before this fails.
  #
  # The qualifier is the whole design. A raw count is two lags added together:
  # the pin behind carve-js, plus carve-js behind carve. Only the first is
  # fixable here, and a gate that fails with a remedy the repo cannot perform
  # gets its tolerance raised until it means nothing. Not zero either: carve-js
  # merges through the day and a pin bumped this morning legitimately trails a
  # fix merged this afternoon.
  DRIFT_MAX_DOCUMENTS: 10

# Each job declares timeout-minutes so a hung step fails fast
# instead of inheriting the 360-minute GitHub default.
jobs:
  corpus:
    name: The pinned engine still renders carve main's corpus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      verdict: ${{ steps.measure.outputs.verdict }}
    steps:
      - uses: actions/checkout@v5

      # DELIBERATELY UNPINNED, unlike the corpus job in ci.yml.
      #
      # The two jobs ask different questions. ci.yml asks whether this
      # repository changed rendering, so both ends have to be fixed or a breach
      # says nothing about the branch that hit it - it is pinned at the spec
      # freeze. This job asks whether the pin here has fallen behind what
      # carve-js can already do, and noticing upstream move is the whole point:
      # a corpus category landing overnight is exactly the event it exists to
      # see, and pinning it away would make the watchtower blind on purpose.
      #
      # Growth alone cannot breach it either. It gates on `attributable`, which
      # subtracts carve-js `main`'s own residual, so a new document that both
      # engines get wrong contributes nothing and only a document `main` renders
      # correctly and the pin does not can move the number. And it runs on
      # `schedule` and `workflow_dispatch`, never on a pull request, so it has
      # no branch to accuse.
      - name: Check out the corpus from carve main
        uses: actions/checkout@v5
        with:
          repository: markup-carve/carve
          path: carve-main

      - name: Check out carve-js
        uses: actions/checkout@v5
        with:
          repository: markup-carve/carve-js
          path: upstream/carve-js

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The lockfile records the git dependencies as `git+ssh://`, so a runner
      # without an SSH key cannot fetch them. Same step as ci.yml and pages.yml.
      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:

      # The engine AS THIS REPO INSTALLS IT. `npm ci` and not `npm install`, so
      # what is measured is the pin the lockfile records rather than whatever a
      # loose resolution would have picked today.
      - run: npm ci

      # The reference the pin is judged against: the same corpus through
      # carve-js `main`. Whatever both get wrong is the engine trailing the
      # language and no pin here can close it; the difference is this repo's.
      - name: Build carve-js main
        run: |
          set -euo pipefail
          cd upstream/carve-js
          npm ci
          npm run build

      - name: Render every corpus document through the pinned engine
        id: measure
        run: |
          set -euo pipefail
          out="$(node tools/corpus-through-engine.mjs \
            node_modules/@markup-carve/carve/dist/index.js \
            carve-main/tests/corpus --list \
            --reference upstream/carve-js/dist/index.js | tee /dev/stderr)"
          field() { printf '%s\n' "$out" | sed -n "s/^$1=//p"; }
          documents="$(field documents)"
          wrong="$(field wrong)"
          reference_wrong="$(field reference_wrong)"
          attributable="$(field attributable)"
          for n in "$documents" "$wrong" "$reference_wrong" "$attributable"; do
            case "$n" in
              ''|*[!0-9]*) echo "::error::corpus-through-engine.mjs did not report every count; the measurement is broken, not drift."; exit 1 ;;
            esac
          done

          echo "the pinned engine renders ${wrong} of ${documents} carve main documents differently"
          echo "carve-js main renders ${reference_wrong} of them differently"
          echo "so ${attributable} are attributable to the pin in this repository"

          if [ "${reference_wrong}" -gt 0 ]; then
            echo "::notice::carve-js main itself renders ${reference_wrong} of ${documents} carve main documents differently. That is upstream engine debt (carve#608) and moving the pin here cannot close it."
          fi

          if [ "${attributable}" -gt "${DRIFT_MAX_DOCUMENTS}" ]; then
            echo "::warning::${attributable} of ${documents} corpus documents render differently through the pinned engine but correctly through carve-js main, over the tolerance of ${DRIFT_MAX_DOCUMENTS}. Bump the '@markup-carve/carve' revision in package.json and refresh the lockfile."
            echo "verdict=drift" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "verdict=clean" >> "$GITHUB_OUTPUT"
          if [ "${attributable}" -gt 0 ]; then
            echo "::warning::${attributable} of ${documents} corpus documents would be fixed by bumping the engine pin (tolerance ${DRIFT_MAX_DOCUMENTS})"
          fi

  # The pins make the org dependencies deterministic; the rest of the tree still
  # floats and a scheduled run of the real suite is what catches one of those
  # changing underneath.
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ci.yml's `test` runs this suite on every pull request; this copy adds a
    # run on a day nobody pushed.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # The lockfile records the git dependencies as `git+ssh://`, so a runner
      # without an SSH key cannot fetch them. Same step as ci.yml and pages.yml.
      - name: Prefer HTTPS for Git dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # A scheduled run reports into a page nobody opens, so the verdict becomes one
  # tracking issue: opened by the first run with drift or a red job, edited by
  # later ones, closed by the first clean one. Scoped to the default branch.
  # The suite stays a red job: a failing test is not a drift measurement.
  report:
    name: File the verdict where someone reads it
    needs: [corpus, suite]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: File the verdict where someone reads it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CORPUS: ${{ needs.corpus.result }}
          VERDICT: ${{ needs.corpus.outputs.verdict }}
          SUITE: ${{ needs.suite.result }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Engine drift tickets are scoped to $DEFAULT_BRANCH; $REF_NAME keeps its Actions verdict only."
            exit 0
          fi

          TITLE="Engine drift: the pinned engine trails carve main, or a scheduled job is red on $DEFAULT_BRANCH"
          MARKER="<!-- engine-drift-verdict ref=$REF_NAME -->"

          # Listed rather than searched: the search index lags a fresh issue.
          open_issues="$(gh api "repos/$REPO/issues?state=open&per_page=100" --paginate \
            | jq -r --arg m "$MARKER" \
                '.[] | select(.pull_request == null) | select((.body // "") | contains($m)) | .number')"
          issue="${open_issues%%$'\n'*}"

          if [ "$CORPUS" = "success" ] && [ "$VERDICT" = "clean" ] && [ "$SUITE" = "success" ]; then
            echo "corpus is within tolerance and suite is green on $HEAD_SHA."
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --repo "$REPO" --body \
                "Green again: run $RUN_URL on \`$HEAD_SHA\`. Closing. The next red run opens a fresh ticket rather than reopening this one."
              gh issue close "$issue" --repo "$REPO"
              echo "Closed #$issue."
            fi
            exit 0
          fi

          {
            echo "$MARKER"
            echo
            echo "The scheduled engine drift run found drift or a red job on \`$DEFAULT_BRANCH\`."
            echo
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| The pinned engine still renders carve main's corpus | \`$CORPUS\`, verdict \`${VERDICT:-none}\` |"
            echo "| suite | \`$SUITE\` |"
            echo
            echo "Run: $RUN_URL, commit \`$HEAD_SHA\`, trigger \`$EVENT_NAME\`."
            echo
            echo "Verdict \`drift\` means carve-js main renders documents correctly that the"
            echo "pinned engine does not: bump \`@markup-carve/carve\` in package.json and"
            echo "refresh the lockfile. That run stays green; this ticket is the signal."
            echo "A red corpus job means the measurement itself broke. A red suite with a"
            echo "green pull request CI means an unpinned dependency moved underneath."
            echo
            echo "This ticket is filed and maintained by the workflow. It is EDITED by each"
            echo "later run with drift or a red job and CLOSED by the first clean one. Closing"
            echo "it by hand does not silence it: the next such run files a new one."
          } > "$RUNNER_TEMP/engine-drift-verdict.md"

          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$REPO" --body-file "$RUNNER_TEMP/engine-drift-verdict.md"
            echo "Updated #$issue."
          else
            url="$(gh issue create --repo "$REPO" --title "$TITLE" \
              --body-file "$RUNNER_TEMP/engine-drift-verdict.md")"
            echo "Filed $url."
          fi
